[pytest]
asyncio_mode = auto
testpaths = tests
# Both loop scopes are `session` to preserve the single session-wide event loop
# this suite has always actually run on. Until pytest-asyncio 1.4.0 that loop
# came from a session-scoped `event_loop` fixture override in conftest.py
# (removed upstream in 1.0.0); these two options are its replacement.
#
# `session` is the conservative value here, not the adventurous one. The async
# engine in conftest.py is a module-level global, so its aiosqlite connection
# pool is bound to whichever loop first touches it -- per-function loops would
# leave pooled connections attached to closed loops. Note also that the ini
# value *overrides* each fixture's own scope rather than defaulting it
# (pytest_asyncio/plugin.py: `_loop_scope or default_loop_scope or
# fixturedef.scope`), so `function` here would have put the session-scoped,
# autouse `setup_database` fixture on a function-scoped runner.
#
# asyncio_default_test_loop_scope must be set explicitly: it defaults to
# `function`, so omitting it would give all 402 async tests their own loops.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
