name: Tests

# push is restricted to main so a branch with an open PR does not run this
# twice (once for the branch push, once for the pull_request event).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    # Pinned, not `ubuntu-latest`: that label now resolves to Ubuntu 26.04,
    # and actions/python-versions publishes no 3.12.11 build for it -- the
    # job failed at "Set up Python" with "The version '3.12.11' with
    # architecture 'x64' was not found for Ubuntu 26.04". The manifest has
    # 3.12.11 for linux x64 on 22.04 and 24.04 only; 26.04 builds start at
    # 3.12.13. The exact patch has to stay 3.12.11 to match
    # backend/.python-version, which is what Render builds against, so the
    # runner moves instead of the interpreter. Revisit if Render's pin moves
    # to a 3.12.x that has a 26.04 build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches Render's real runtime: render.yaml sets `runtime: python`
          # with `rootDir: backend`, and Render reads the version from
          # backend/.python-version, which pins 3.12.11.
          python-version: "3.12.11"
      - run: pip install -r requirements.txt
        working-directory: backend
      # pytest.ini sets testpaths = tests, so a bare `pytest` picks up the
      # suite and the session-scoped asyncio loop config.
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      # `npm run build` is tsc -b && vite build; split so a type error is
      # reported as a typecheck failure and the tests run before the build.
      - run: npx tsc -b
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx vite build
        working-directory: frontend
