name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # ecdsa 0.19.2, PYSEC-2026-1325 (CVSS 7.4) -- Minerva timing attack on
      # P-256. Ignored, not deferred: no fixed version exists and none is
      # planned, the maintainers consider side channels out of scope for a
      # pure-Python implementation. Unreachable here regardless -- the attack
      # is on signing, key generation and ECDH, while this app only *verifies*
      # HS256/RS256 with `algorithms=[...]` pinned (app/core/security.py,
      # app/services/firebase_auth.py). Revisit if either ever signs with EC
      # keys, or if upstream reverses position.
      # python-jose 3.5.0, CVE-2026-85394 (CVSS 4.0 9.3) -- asymmetric keys are
      # not validated during HMAC init, so a DER-encoded public key lacking PEM
      # armor is accepted as an HMAC secret. Anyone holding the service's public
      # key can then forge HS256 tokens. Incomplete fix for CVE-2024-33663; no
      # fixed version exists.
      #
      # Ignored because the exploit needs BOTH of its preconditions and this app
      # provides neither. (1) `algorithms` unrestricted: both decode sites pin it
      # -- app/core/security.py:67 to ["HS256"], app/services/firebase_auth.py:166
      # to ["RS256"], and firebase_auth.py:153 rejects any header alg != RS256
      # before decode is even called. (2) a DER public key as the verifying key:
      # security.py passes a symmetric secret, firebase_auth.py passes a JWK dict
      # straight from Google's /v1/jwk/ endpoint. No DER, no unpinned algorithm.
      #
      # Revisit if any jwt.decode() call loses its explicit `algorithms=[...]`,
      # if a PEM/DER public key is ever passed as a verification key, or if
      # upstream ships a fix -- at which point drop this and pin the fixed
      # version. Migrating to PyJWT also removes it (see requirements.txt).
      - run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325 --ignore-vuln CVE-2026-85394

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      # The repo root carries its own package-lock.json (devDependencies only,
      # but they resolve their own transitive tree -- undici via jsdom, for
      # one). Auditing only frontend/ meant a root-only finding could never
      # be caught here. `npm audit` reads the lockfile directly, so this
      # needs no `npm ci` of its own.
      - name: npm audit (repo root)
        run: npm audit --audit-level=high
