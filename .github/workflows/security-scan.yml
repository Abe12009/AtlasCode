name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # ecdsa 0.19.2, PYSEC-2026-1325 (CVSS 7.4) -- Minerva timing attack on
      # P-256. Ignored, not deferred: no fixed version exists and none is
      # planned, the maintainers consider side channels out of scope for a
      # pure-Python implementation. Unreachable here regardless -- the attack
      # is on signing, key generation and ECDH, while this app only *verifies*
      # HS256/RS256 with `algorithms=[...]` pinned (app/core/security.py,
      # app/services/firebase_auth.py). Revisit if either ever signs with EC
      # keys, or if upstream reverses position.
      - run: pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      # The repo root carries its own package-lock.json (devDependencies only,
      # but they resolve their own transitive tree -- undici via jsdom, for
      # one). Auditing only frontend/ meant a root-only finding could never
      # be caught here. `npm audit` reads the lockfile directly, so this
      # needs no `npm ci` of its own.
      - name: npm audit (repo root)
        run: npm audit --audit-level=high
