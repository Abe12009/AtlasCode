name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      # The repo root carries its own package-lock.json (devDependencies only,
      # but they resolve their own transitive tree -- undici via jsdom, for
      # one). Auditing only frontend/ meant a root-only finding could never
      # be caught here. `npm audit` reads the lockfile directly, so this
      # needs no `npm ci` of its own.
      - name: npm audit (repo root)
        run: npm audit --audit-level=high
