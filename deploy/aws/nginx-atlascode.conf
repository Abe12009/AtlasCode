# nginx reverse proxy for the AtlasCode backend, EC2 + Let's Encrypt/certbot.
#
# Install:
#   sudo cp deploy/aws/nginx-atlascode.conf /etc/nginx/conf.d/atlascode.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see deploy/aws/README.md, Step "EC2 — TLS"):
#   sudo certbot --nginx -d api.yourdomain.com
# certbot rewrites this file in place to add the 443 server block and the
# 80 -> 443 redirect — the block below is the pre-certbot starting point.
#
# Replace api.yourdomain.com with your real backend domain before running
# certbot (it validates ownership of exactly the name(s) you pass it).

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    client_max_body_size 5m;

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
