services:
  - type: web
    name: atlascode-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: AtlasCode
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: atlascode-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: CORS_ORIGINS
        sync: false
      # Optional: only needed to enable Google/GitHub sign-in and Firebase
      # password reset. Leave unset to run with email/password auth only.
      - key: FIREBASE_PROJECT_ID
        sync: false
      # Optional: only needed to enable Cody (the AI companion). Leave unset
      # and /cody/chat returns 503 rather than the app failing to boot.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CODY_MODEL
        value: anthropic/claude-haiku-4.5
      - key: CODY_RATE_LIMIT_PER_HOUR
        value: "30"
      - key: CODY_HISTORY_CONTEXT_SIZE
        value: "10"
      # Global kill switch on top of the per-user hourly limit above: once
      # every user's combined Cody spend in the trailing 24h reaches this,
      # /cody/chat returns 503 instead of calling OpenRouter. 0 disables it.
      - key: CODY_DAILY_SPEND_CAP_USD
        value: "10.0"
      # Optional: only needed to enable password reset by email for
      # local-password accounts. Leave RESEND_API_KEY unset and
      # /auth/forgot-password returns 503 rather than the app failing to boot.
      - key: RESEND_API_KEY
        sync: false
      # Must be a verified sender/domain in the Resend account above --
      # prompted rather than defaulted so production never silently uses
      # Resend's shared onboarding@resend.dev sandbox sender.
      - key: EMAIL_FROM_ADDRESS
        sync: false
      # Origin the emailed reset link points at, e.g. your frontend's
      # production URL. No trailing slash.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: PASSWORD_RESET_RATE_LIMIT_PER_EMAIL_PER_HOUR
        value: "3"
      - key: PASSWORD_RESET_RATE_LIMIT_PER_IP_PER_HOUR
        value: "10"
      # Per-user (or per-IP, for an anonymous submitter) cap on the in-app
      # feedback form -- same "count rows in a window" style as the limits
      # above.
      - key: FEEDBACK_RATE_LIMIT_PER_HOUR
        value: "5"

databases:
  - name: atlascode-db
    plan: free
    databaseName: atlascode
    user: atlascode
