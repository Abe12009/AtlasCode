services:
  - type: web
    name: atlascode-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: AtlasCode
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: atlascode-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: atlascode-db
    plan: free
    databaseName: atlascode
    user: atlascode
